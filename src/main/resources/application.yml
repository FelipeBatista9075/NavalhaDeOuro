spring:
  application:
    name: navalhaouro

  datasource:
    url: jdbc:postgresql://localhost:5431/navalhaouro
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration